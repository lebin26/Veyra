<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sign In · Veyra Trading</title>
    <meta name="description" content="Sign in to Veyra Trading private quantitative suite.">
    <link rel="stylesheet" href="auth.css">
    <script src="../config.js"></script>
    <script>
        // Synchronize dark/light theme before render
        try {
            const saved = localStorage.getItem("calc_theme");
            if (saved === "dark" || (!saved && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        } catch (e) {}
    </script>
</head>
<body>
    <!-- Top Brand Nav -->
    <header class="auth-top-nav">
        <a href="../main-page/index.html" class="brand-eyebrow" aria-label="Back to Veyra Apps">
            <span class="brand-logo-mark"></span>
            <span class="brand-title">Veyra Trading</span>
        </a>
        <button type="button" id="theme-toggle-btn" class="theme-ghost-btn" aria-label="Toggle theme" title="Toggle theme (T)">
            <svg class="theme-icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>
    </header>

    <!-- Main Card -->
    <main class="auth-container">
        <div class="auth-card">
            <div class="auth-card-header">
                <h1 class="auth-heading">Sign In</h1>
                <p class="auth-subheading">Private Quantitative Trading Suite · Invite-Only</p>
            </div>

            <!-- Error Banner -->
            <div id="error-banner" class="alert-banner alert-error hidden" role="alert">
                <svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span id="error-text">Invalid credentials</span>
            </div>

            <!-- Sign In Form -->
            <form id="login-form" class="auth-form" autocomplete="on">
                <div class="form-group">
                    <label for="email" class="form-label">Username</label>
                    <div class="input-wrapper">
                        <input type="text" id="email" class="form-input" placeholder="Username" required autocomplete="username" autocapitalize="none" spellcheck="false">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" id="btn-toggle-password" class="input-icon-btn" aria-label="Show password" title="Toggle password visibility">
                            <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-actions-row">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember-me" checked>
                        <span>Remember me</span>
                    </label>
                    <a href="reset-password.html?mode=forgot" class="link-muted">Forgot password?</a>
                </div>

                <button type="submit" id="btn-submit" class="btn-primary">
                    <span id="btn-text">Sign In</span>
                    <span id="btn-spinner" class="spinner hidden"></span>
                </button>
            </form>

            <div class="auth-notice">
                Registration is by invitation only. If you need access, please contact your administrator.
            </div>
        </div>
    </main>

    <!-- Page Footer -->
    <footer class="auth-page-footer">
        Veyra Trading · Proprietary Quantitative Platform
    </footer>

    <!-- Client Logic -->
    <script type="module">
        import { signIn, getCurrentUserAndProfile } from '../js/auth/authState.js?v=5';

        const elements = {
            form: document.getElementById('login-form'),
            email: document.getElementById('email'),
            password: document.getElementById('password'),
            btnTogglePassword: document.getElementById('btn-toggle-password'),
            btnSubmit: document.getElementById('btn-submit'),
            btnText: document.getElementById('btn-text'),
            btnSpinner: document.getElementById('btn-spinner'),
            errorBanner: document.getElementById('error-banner'),
            errorText: document.getElementById('error-text'),
            themeToggleBtn: document.getElementById('theme-toggle-btn')
        };

        // Theme Toggle
        elements.themeToggleBtn.addEventListener('click', () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('calc_theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('calc_theme', 'dark');
            }
        });

        // Show / Hide password toggle
        let showPassword = false;
        elements.btnTogglePassword.addEventListener('click', () => {
            showPassword = !showPassword;
            elements.password.type = showPassword ? 'text' : 'password';
            elements.btnTogglePassword.innerHTML = showPassword
                ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`
                : `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
        });

        // Auto-redirect if already signed in
        (async () => {
            try {
                const { user, profile } = await getCurrentUserAndProfile();
                if (user && profile && profile.status === 'active') {
                    const params = new URLSearchParams(window.location.search);
                    const returnUrl = params.get('redirect') || '../main-page/index.html';
                    // Validate redirect URL is same-origin
                    const safeUrl = returnUrl.startsWith('http') ? '../main-page/index.html' : returnUrl;
                    window.location.replace(safeUrl);
                }
            } catch (e) {}
        })();

        // Helper to reset button state
        function resetLoadingState() {
            elements.btnSubmit.disabled = false;
            elements.btnText.textContent = 'Sign In';
            elements.btnSpinner.classList.add('hidden');
        }

        // Form Submission
        elements.form.addEventListener('submit', async (e) => {
            e.preventDefault();
            elements.errorBanner.classList.add('hidden');

            const email = elements.email.value.trim();
            const password = elements.password.value;

            if (!email || !password) return;

            elements.btnSubmit.disabled = true;
            elements.btnText.textContent = 'Signing in...';
            elements.btnSpinner.classList.remove('hidden');

            try {
                const result = await signIn(email, password);

                if (!result.success) {
                    resetLoadingState();
                    elements.errorText.textContent = result.error || 'Invalid credentials. Please try again.';
                    elements.errorBanner.classList.remove('hidden');
                    return;
                }

                if (result.mustChangePassword) {
                    const params = new URLSearchParams(window.location.search);
                    const originalTarget = params.get('redirect') || '../main-page/index.html';
                    window.location.replace(`reset-password.html?must_change=true&redirect=${encodeURIComponent(originalTarget)}`);
                    return;
                }

                const params = new URLSearchParams(window.location.search);
                const rawTarget = params.get('redirect') || '../main-page/index.html';
                // Validate redirect URL is safe (same-origin relative path only)
                const target = rawTarget.startsWith('http') ? '../main-page/index.html' : rawTarget;
                window.location.replace(target);
            } catch (err) {
                resetLoadingState();
                elements.errorText.textContent = (err && err.message) ? err.message : 'Network error. Please try again.';
                elements.errorBanner.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
