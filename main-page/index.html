<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Veyra Trading · Applications</title>
    <meta name="description" content="Veyra Trading proprietary quantitative trading applications suite.">
    <link rel="stylesheet" href="style.css">
    <script src="../config.js"></script>
</head>
<body>
    <main class="app-shell" role="main">
        <!-- 1. Header & Brand Suite (Identical to Calculator UI) -->
        <header class="app-header">
            <div class="header-top-row">
                <div class="header-brand-group">
                    <div class="brand-eyebrow">
                        <span class="brand-logo-mark"></span>
                        <span class="brand-title">Veyra Trading</span>
                    </div>
                    <h1 id="app-title" class="function-title">Trading Applications</h1>
                </div>
                <div class="header-right-actions">
                    <div id="auth-status-container" class="auth-status-wrap">
                        <a href="../auth/login.html" id="btn-header-signin" class="btn-header-signin">Sign In</a>
                    </div>
                    <button type="button" id="theme-toggle-btn" class="theme-ghost-btn" aria-label="Toggle theme" title="Toggle theme (T)">
                        <svg id="theme-icon-svg" class="theme-icon-svg" viewBox="0 0 24 24">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <!-- 2. Minimalist App Icon Grid (Icon + Name Only) -->
        <section class="calc-section">
            <div class="apps-icon-grid" role="list" aria-label="Available Applications">
                <!-- App 1: Position Size Calculator (Active) -->
                <a href="../calculator/index.html" id="app-link-calculator" class="app-icon-tile active-app" role="listitem" aria-label="Position Size Calculator">
                    <div class="app-icon-squircle icon-calculator">
                        <svg class="app-svg-glyph" viewBox="0 0 48 48" fill="none">
                            <rect x="8" y="6" width="32" height="36" rx="8" stroke="currentColor" stroke-width="2.5" />
                            <rect x="14" y="12" width="20" height="7" rx="3" fill="currentColor" fill-opacity="0.2" stroke="currentColor" stroke-width="1.8" />
                            <circle cx="16" cy="26" r="2.2" fill="currentColor" />
                            <circle cx="24" cy="26" r="2.2" fill="currentColor" />
                            <circle cx="32" cy="26" r="2.2" fill="currentColor" />
                            <circle cx="16" cy="34" r="2.2" fill="currentColor" />
                            <circle cx="24" cy="34" r="2.2" fill="currentColor" />
                            <circle cx="32" cy="34" r="2.2" fill="currentColor" />
                        </svg>
                    </div>
                    <span class="app-icon-name">Position Size Calculator</span>
                </a>

                <!-- App 2: Trade Journal (members only — lock applied by JS if not logged in) -->
                <div id="app-link-journal" class="app-icon-tile active-app" role="listitem" aria-label="Trade Journal" tabindex="0">
                    <div class="app-icon-squircle icon-journal">
                        <svg class="app-svg-glyph" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="10" y="8" width="28" height="32" rx="4" />
                            <line x1="16" y1="16" x2="32" y2="16" />
                            <line x1="16" y1="23" x2="32" y2="23" />
                            <line x1="16" y1="30" x2="26" y2="30" />
                        </svg>
                    </div>
                    <span class="app-icon-name">Trade Journal</span>
                </div>

                <!-- App 3: Risk Planner (Coming Soon) -->
                <button type="button" class="app-icon-tile app-coming-soon" role="listitem" data-app-name="Risk Planner" aria-label="Risk Planner">
                    <div class="app-icon-squircle icon-risk">
                        <svg class="app-svg-glyph" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M24 6l15 6v13c0 9.5-6.5 17-15 19-8.5-2-15-9.5-15-19V12l15-6z" />
                            <path d="M18 24l4 4 8-8" />
                        </svg>
                    </div>
                    <span class="app-icon-name">Risk Planner</span>
                </button>

                <!-- App 4: Market Radar (Coming Soon) -->
                <button type="button" class="app-icon-tile app-coming-soon" role="listitem" data-app-name="Market Radar" aria-label="Market Radar">
                    <div class="app-icon-squircle icon-radar">
                        <svg class="app-svg-glyph" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="24" cy="24" r="16" />
                            <circle cx="24" cy="24" r="9" />
                            <circle cx="24" cy="24" r="2.5" fill="currentColor" />
                            <line x1="24" y1="8" x2="24" y2="24" />
                        </svg>
                    </div>
                    <span class="app-icon-name">Market Radar</span>
                </button>
            </div>
        </section>

        <!-- 3. Page Trust & Keyboard Shortcuts Footer -->
        <footer class="page-trust-footer">
            <div class="desktop-shortcuts-hint" aria-label="Keyboard Shortcuts">
                <span class="shortcuts-title">Shortcuts:</span>
                <span class="shortcut-tag"><kbd>1</kbd> Calculator</span>
                <span class="shortcut-tag"><kbd>T</kbd> Theme</span>
            </div>
            <div class="footer-brand">Veyra Trading</div>
            <div class="disclaimer-text">
                <a href="../legal/terms.html" style="color:inherit;text-decoration:none;margin-right:10px;">Terms</a>
                <a href="../legal/privacy.html" style="color:inherit;text-decoration:none;">Privacy</a>
            </div>
        </footer>

        <!-- Toast Notification -->
        <div id="launcher-toast" class="launcher-toast hidden" role="status" aria-live="polite">
            <span id="launcher-toast-message">Application under development</span>
        </div>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
